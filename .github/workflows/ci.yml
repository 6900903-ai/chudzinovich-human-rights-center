name: CHUDO HRC CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate package metadata
        run: npm --version && node --version
      - name: Validate public boundaries and registries
        run: npm run validate
      - name: Build static site
        run: npm run build
      - name: Run complete test suite
        run: npm test
      - name: Research live production deployment
        env:
          CHRC_DEPLOYMENT_VALIDATION_NETWORK_GATE: PASS
        run: npm run deployment:validate
