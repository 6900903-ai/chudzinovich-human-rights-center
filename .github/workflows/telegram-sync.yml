name: CHUDO Telegram Sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-sync.yml']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-sync
  cancel-in-progress: false

jobs:
  fetch:
    if: github.repository == '6900903-ai/chudzinovich-human-rights-center'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted-source reader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch registered Telegram public previews
        env:
          TELEGRAM_NETWORK_GATE: PASS
          FETCHER_SECURITY_GATE: PASS
          TELEGRAM_SOURCE_REUSE_GATE: PASS
        run: npm run telegram:sync
      - name: Validate sanitized Telegram snapshot
        run: node scripts/validate-telegram-feed.mjs
      - name: Run Telegram feed regression
        run: npm run test:telegram-live
      - name: Seal candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 sync-artifact
          cp data/public/telegram.json sync-artifact/telegram.json
          (cd sync-artifact && sha256sum telegram.json > SHA256SUMS)
      - name: Upload sanitized candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-public-candidate-${{ github.run_id }}
          path: sync-artifact
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: fetch
    if: github.repository == '6900903-ai/chudzinovich-human-rights-center'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout current protected publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download sealed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: telegram-public-candidate-${{ github.run_id }}
          path: sync-artifact
      - name: Verify and promote candidate without source-network access
        shell: bash
        run: |
          set -euo pipefail
          (cd sync-artifact && sha256sum -c SHA256SUMS)
          cp sync-artifact/telegram.json data/public/telegram.json
          node scripts/validate-telegram-feed.mjs
          npm run test:telegram-live
      - name: Commit only validated public Telegram data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/public/telegram.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/public/telegram.json
          git commit -m 'Sync registered Telegram source feeds'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
