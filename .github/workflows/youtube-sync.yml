name: CHUDO YouTube Sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == '6900903-ai/chudzinovich-human-rights-center'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch exact official YouTube RSS feed
        run: node scripts/sync-youtube.mjs
      - name: Validate sanitized YouTube snapshot
        run: node scripts/validate-youtube.mjs
      - name: Run YouTube integration regression
        run: node tests/youtube-integration.mjs
      - name: Commit only sanitized public YouTube data
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/public/youtube.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/public/youtube.json
          git commit -m 'Sync official YouTube channel feed'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch isolated Pages build after data change
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
