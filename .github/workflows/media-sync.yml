name: CHUDO Media RSS Sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/media-sync.yml']
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: media-rss-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == '6900903-ai/chudzinovich-human-rights-center'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch verified first-party RSS metadata
        env:
          MEDIA_MONITOR_NETWORK_GATE: PASS
          FETCHER_SECURITY_GATE: PASS
          MEDIA_PUBLIC_RSS_METADATA_GATE: PASS
        run: npm run media:sync
      - name: Validate metadata-only media snapshot
        run: node scripts/validate-media-feed.mjs
      - name: Run media feed regression
        run: npm run test:media-live
      - name: Commit only sanitized public media metadata
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/public/media-feed.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/public/media-feed.json
          git commit -m 'Sync verified Belarus media RSS metadata'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch Pages build after media feed change
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
